<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="520" viewBox="0 0 1280 520" role="img" aria-labelledby="title description">
  <title id="title">CallRail SDK for TypeScript and Node.js</title>
  <desc id="description">yannelli/callrail-sdk-typescript. An unofficial CallRail API v3 client. A near-black canvas with the headline, two lines of description, a single white rail that becomes a call waveform, and a button naming the GitHub repository.</desc>
  <rect width="1280" height="520" fill="#09090b"/>
  <g transform="translate(0 0)" font-family="'Instrument Sans', Inter, 'Segoe UI', -apple-system, Helvetica, Arial, sans-serif">
