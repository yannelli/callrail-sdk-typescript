    </g>
    <g fill="#ecebe7" font-family="Arial, Helvetica, sans-serif" font-size="26">
      <text x="898" y="113">Calls</text>
      <text x="898" y="223">Texts</text>
      <text x="898" y="421">Webhooks</text>
    </g>
    <rect x="1118" y="220" width="100" height="68" fill="#ecebe7"/>
    <text x="1168" y="265" fill="#38450f" text-anchor="middle" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="700">TS</text>
  </g>
  <rect y="552" width="1280" height="88" fill="#38450f"/>
  <g fill="#ecebe7" font-family="Arial, Helvetica, sans-serif">
    <text x="64" y="606" font-size="30">yannelli/callrail-sdk-typescript</text>
    <text x="1216" y="606" font-size="24" text-anchor="end">Unofficial SDK</text>
  </g>
