<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title description">
  <title id="title">CallRail SDK for TypeScript and Node.js</title>
  <desc id="description">yannelli/callrail-sdk-typescript. An unofficial CallRail API v3 client. Calls, texts, and webhooks connect to TypeScript.</desc>
  <rect width="1280" height="640" fill="#ecebe7"/>
  <rect x="850" width="430" height="640" fill="#38450f"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#38450f">
    <text x="64" y="210" font-size="128" font-weight="700" letter-spacing="-6">CallRail</text>
    <text x="64" y="302" font-size="82" font-weight="700" letter-spacing="-3">TypeScript SDK</text>
    <text x="68" y="366" font-size="30">CallRail API v3 · Node.js</text>
    <text x="68" y="427" font-family="monospace" font-size="27">npm install callrail</text>
  </g>
  <g transform="translate(0 52)">
    <g fill="none" stroke="#c4d496" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 902 144 H 990 Q 1036 144 1036 190 V 208 Q 1036 254 1082 254 H 1174"/>
